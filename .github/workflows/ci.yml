name: Frontend and database CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run lint and typecheck
        run: pnpm lint

      - name: Build production bundle
        run: pnpm build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Start local Supabase
        id: supabase-start
        run: supabase start

      - name: Reset local database
        run: supabase db reset --local --yes

      - name: Run database tests
        run: supabase test db --local

      - name: Lint local database
        run: supabase db lint --local

      - name: Stop local Supabase
        if: always() && steps.supabase-start.outcome == 'success'
        run: supabase stop --no-backup
